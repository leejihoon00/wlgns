<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자격증 길잡이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#F5F6F8; --surface:#FFFFFF; --ink:#18233F; --muted:#5A6377; --line:#DCE0E7;
  --navy:#24407A; --navy-ink:#FFFFFF; --chip:#ECEFF5;
  --hl:rgba(255,214,64,.55); --hl-strong:#FFD640;
  --reg:#0E8574; --due:#C8661A; --exam:#C2394A; --result:#6A4CC0;
  --ok:#0E7A4F; --ok-bg:#E3F4EB; --warn:#8A5A00; --warn-bg:#FFF2D6; --chk:#5A6377; --chk-bg:#ECEFF5;
  --shadow:0 1px 2px rgba(24,35,63,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#11151D; --surface:#1A202C; --ink:#E7EBF3; --muted:#9BA5B9; --line:#2D3547;
    --navy:#8DAEF0; --navy-ink:#0F1524; --chip:#242C3D;
    --hl:rgba(255,206,64,.28); --hl-strong:#E6BE3A;
    --reg:#3CC4AE; --due:#F0A257; --exam:#F27D8A; --result:#AE93F2;
    --ok:#5FD39A; --ok-bg:#163327; --warn:#F2C46A; --warn-bg:#3A2E12; --chk:#AEB7C9; --chk-bg:#242C3D;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#11151D; --surface:#1A202C; --ink:#E7EBF3; --muted:#9BA5B9; --line:#2D3547;
  --navy:#8DAEF0; --navy-ink:#0F1524; --chip:#242C3D;
  --hl:rgba(255,206,64,.28); --hl-strong:#E6BE3A;
  --reg:#3CC4AE; --due:#F0A257; --exam:#F27D8A; --result:#AE93F2;
  --ok:#5FD39A; --ok-bg:#163327; --warn:#F2C46A; --warn-bg:#3A2E12; --chk:#AEB7C9; --chk-bg:#242C3D;
  --shadow:none;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--hl-strong);outline-offset:2px;border-radius:6px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:8px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.acct{display:flex;align-items:center;gap:8px;flex:none}
.bell{position:relative;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.bell-n{position:absolute;top:4px;right:4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--exam);color:#fff;font-size:12px;font-weight:700;line-height:18px;text-align:center}
.who{font-size:14px;color:var(--muted);max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who.on{color:var(--ink);font-weight:600}
@media (max-width:520px){.brand p{display:none}.who{max-width:84px}}
.board-top{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.post-list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.post-list li{border-top:1px solid var(--line)}
.post-list li:first-child{border-top:0}
.post-row{display:block;width:100%;text-align:left;background:none;border:0;padding:14px 18px;cursor:pointer}
.post-row:hover{background:var(--paper)}
.post-title{font-size:17px;font-weight:600;margin:4px 0 2px}
.post-meta{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.cat{display:inline-block;font-size:13px;font-weight:600;padding:1px 8px;border-radius:6px}
.cat-q{background:var(--chk-bg);color:var(--navy)}
.cat-tip{background:var(--hl);color:var(--ink)}
.cat-pass{background:var(--ok-bg);color:var(--ok)}
.cat-free{background:var(--chip);color:var(--muted)}
.post-body{white-space:pre-wrap;word-break:break-word;font-size:16px;line-height:1.7;margin:0 0 18px}
.like{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.like[aria-pressed="true"]{background:var(--hl);border-color:transparent}
.cmt{border-top:1px solid var(--line);padding:12px 0}
.cmt-head{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
.cmt-head strong{color:var(--ink)}
.cmt p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word}
textarea.ta{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font:inherit;resize:vertical}
form.f textarea{min-height:200px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font:inherit;resize:vertical}
.notif-item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.notif-item:first-child{border-top:0}
.notif-item .t{flex:1}
.unread{width:8px;height:8px;border-radius:50%;background:var(--exam);margin-top:9px;flex:none}
.toggle{display:flex;align-items:center;gap:8px;font-size:15px;min-height:40px}
.toggle input{width:20px;height:20px}
.mine-tag{font-size:12px;padding:0 6px;border-radius:5px;background:var(--chip);color:var(--muted)}
.brand h1{margin:0;font-size:21px;font-weight:700;letter-spacing:-.02em}
.brand p{margin:0;color:var(--muted);font-size:14px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 14px 12px;font-size:16px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--hl-strong)}
.badge-n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--chip);font-size:13px;text-align:center}

main{max-width:1080px;margin:0 auto;padding:20px 20px 120px}
h2,h3{letter-spacing:-.02em}
.muted{color:var(--muted)}
.small{font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);font-weight:600}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.linkbtn{background:none;border:0;padding:0;color:var(--navy);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}

/* month header */
.month-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.month-title{margin:0;display:flex;align-items:baseline;gap:10px}
.month-title .yr{font-size:18px;color:var(--muted);font-weight:500}
.month-title .mo{font-size:56px;line-height:1;font-weight:700;letter-spacing:-.04em;background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 4px}
.month-nav{display:flex;gap:6px;margin-left:auto;align-items:center}
.icon-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;cursor:pointer;font-size:15px;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}

.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
@media (max-width:760px){.twocol{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 4px;font-size:18px}
.panel .sub{margin:0 0 12px;color:var(--muted);font-size:14px}
.ev-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.ev-list li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.ev-list li:first-child{border-top:0}
.ev-name{font-weight:600;background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:16px}
.ev-name:hover{text-decoration:underline}
.ev-meta{grid-column:1;color:var(--muted);font-size:14px}
.ev-side{grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.dday{font-weight:700;font-size:15px;padding:2px 8px;border-radius:6px;background:var(--chip);white-space:nowrap}
.dday.hot{background:var(--hl);}
.empty{padding:14px 0 4px;color:var(--muted);font-size:15px}

/* calendar */
.cal-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-hl{width:22px;height:10px;background:var(--hl);border-radius:2px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-reg{background:var(--reg)}.d-due{background:var(--due)}.d-exam{background:var(--exam)}.d-result{background:var(--result)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wd{padding:8px 0;text-align:center;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.cal .wd.sun{color:var(--exam)}
.day{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;background:none;border-top:0;border-left:0;text-align:left;cursor:pointer;position:relative}
.day:nth-child(7n){border-right:0}
.day.out{opacity:.38}
.day .num{font-size:14px;font-weight:600;width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.day.today .num{background:var(--ink);color:var(--paper)}
.day.sel{outline:2px solid var(--navy);outline-offset:-2px}
.day .hlbar{position:absolute;left:0;right:0;top:36px;height:10px;background:var(--hl)}
.day .evs{display:flex;flex-direction:column;gap:2px;margin-top:10px;position:relative}
.pill{display:flex;align-items:center;gap:4px;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill .txt{overflow:hidden;text-overflow:ellipsis}
.more{font-size:12px;color:var(--muted)}
@media (max-width:640px){
  .day{min-height:64px;padding:4px}
  .day .num{font-size:13px;width:24px;height:24px}
  .day .hlbar{top:30px;height:8px}
  .day .evs{flex-direction:row;flex-wrap:wrap;gap:3px;margin-top:12px}
  .pill .txt,.more{display:none}
  .month-title .mo{font-size:44px}
}
.daypanel{padding:16px 18px;border-top:1px solid var(--line)}
.daypanel h4{margin:0 0 8px;font-size:17px}

.manage{margin-top:20px}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
details.mine{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
details.mine summary{cursor:pointer;padding:12px 0;font-weight:600}
.sched-row{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:14px 16px;font-size:15px;margin:0 0 16px}
.notice strong{display:block;margin-bottom:2px}
.notice.info{background:var(--chip);color:var(--ink)}
.src-tag{display:inline-block;font-size:12px;padding:0 6px;border-radius:5px;background:var(--ok-bg);color:var(--ok);font-weight:600;vertical-align:1px}

/* explore */
.explore-top{display:flex;flex-direction:column;gap:14px;margin-bottom:18px}
.search{position:relative}
.search input{width:100%;min-height:52px;border:2px solid var(--line);border-radius:12px;padding:0 16px 0 44px;background:var(--surface);font-size:17px}
.search input:focus{border-color:var(--navy);outline:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;cursor:pointer;font-size:15px;min-height:40px}
@media (max-width:640px){.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:0 20px 4px}.chip{white-space:nowrap;flex:none}}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;font-size:15px}
.filters label{display:inline-flex;align-items:center;gap:6px}
.filters select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px}
.filters input[type=checkbox]{width:18px;height:18px}
.result-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:8px 0 12px}
.result-head h2{margin:0;font-size:20px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.card .c-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{margin:0;font-size:18px;line-height:1.35}
.card h3 button{background:none;border:0;padding:0;text-align:left;cursor:pointer;font-size:inherit;font-weight:700}
.card h3 button:hover{text-decoration:underline}
.kind{display:inline-block;font-size:13px;padding:1px 8px;border-radius:6px;background:var(--chip);color:var(--muted);font-weight:500}
.facts{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0}
.stars{color:var(--hl-strong);letter-spacing:1px}
:root .stars{color:#D9A400}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stars{color:var(--hl-strong)}}
.elig{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px}
.elig.ok{background:var(--ok-bg);color:var(--ok)}
.elig.likely{background:var(--warn-bg);color:var(--warn)}
.elig.check{background:var(--chk-bg);color:var(--chk)}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.fav{background:none;border:0;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;gap:4px;min-height:40px;padding:0 6px;color:var(--muted)}
.fav[aria-pressed="true"]{color:var(--exam);font-weight:600}
.cmp{display:inline-flex;align-items:center;gap:6px;font-size:15px;cursor:pointer;min-height:40px}
.cmp input{width:18px;height:18px}

.jobs{margin-top:28px}
.jobs h2{font-size:20px;margin:0 0 12px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.job h3{margin:0 0 2px;font-size:17px}
.job p{margin:0 0 8px;color:var(--muted);font-size:15px}
.minichips{display:flex;flex-wrap:wrap;gap:6px}
.minichip{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer}
.minichip:hover{border-color:var(--navy)}
.minichip.plain{cursor:default}

/* compare bar */
.cmpbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
.cmpbar-in{max-width:1080px;width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cmpbar .names{flex:1;min-width:160px;font-size:15px}

/* overlay */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,14,24,.45);display:flex;justify-content:center;align-items:flex-end}
@media (min-width:760px){.ov{align-items:center;padding:24px}}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{border-radius:18px;padding-bottom:24px}}
.sheet-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);z-index:1}
.sheet-head h2{margin:0;font-size:20px;flex:1}
.sheet-body{padding:18px 20px}
.sec{margin:0 0 22px}
.sec h3{margin:0 0 8px;font-size:16px;color:var(--muted);font-weight:600}
.sec p{margin:0}
.road{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.road .step{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper);font-size:15px}
.road button.step{cursor:pointer}
.road button.step:hover{border-color:var(--navy)}
.road .step.cur{background:var(--hl);border-color:transparent;font-weight:700}
.road .arr{color:var(--muted)}
.road-label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
ul.plain{margin:0;padding-left:20px}
.apply{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.apply .btn{align-self:flex-start}
.src{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

table.cmpt{width:100%;border-collapse:collapse;font-size:15px;min-width:560px}
.tscroll{overflow-x:auto}
table.cmpt th,table.cmpt td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:top}
table.cmpt thead th{font-size:16px}
table.cmpt tbody th{color:var(--muted);font-weight:500;width:110px;white-space:nowrap}

form.f{display:flex;flex-direction:column;gap:14px}
form.f label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:15px}
form.f input,form.f select{min-height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);font-size:16px}
form.f .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){form.f .two{grid-template-columns:1fr}}
.hint{font-weight:400;color:var(--muted);font-size:13px}
.err{color:var(--exam);font-size:15px;font-weight:600;min-height:1em}

.profile{max-width:620px}
.profile .panel{margin-bottom:16px}

footer.ft{max-width:1080px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:14px}
footer.ft p{margin:0;padding-top:16px;border-top:1px solid var(--line)}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">

function byId(id){return CERTS.find(c=>c.id===id);}
function byName(n){return CERTS.find(c=>c.name===n);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));}
function pd(s){ if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const WD="일월화수목금토";
function fmt(d){ if(!d) return ""; return (d.getMonth()+1)+"."+d.getDate()+"("+WD[d.getDay()]+")"; }
function diff(d){ return Math.round((d-TODAY)/86400000); }
function ddayText(n){ return n===0?"D-day":(n>0?"D-"+n:"D+"+(-n)); }
function stars(n){return "★".repeat(n)+"☆".repeat(3-n);}
function isFav(id){return D.favs.includes(id);}

function eligStatus(c){
  if(c.elig==="none") return {cls:"ok",t:"응시 가능"};
  if(c.elig==="check") return {cls:"check",t:"조건 확인 필요"};
  const p=D.profile, e=p.edu, x=Number(p.exp||0);
  if(!e) return {cls:"check",t:"조건 확인 필요"};
  let likely=false;
  if(c.elig==="gisa") likely = e==="univ" || (e==="col3"&&x>=1) || (e==="col2"&&x>=2) || x>=4;
  if(c.elig==="saneop") likely = e==="univ"||e==="col3"||e==="col2"|| x>=2;
  return likely?{cls:"likely",t:"응시 가능성 높음"}:{cls:"check",t:"조건 확인 필요"};
}

function visibleScheds(){
  return [...OFFICIAL,...D.schedules].filter(s=>!S.favOnly || isFav(s.certId));

function eventsOn(date){
  const out=[]; const t=date.getTime();
  for(const s of visibleScheds()){
    const rs=pd(s.regStart), re=pd(s.regEnd), es=pd(s.examStart), ee=pd(s.examEnd)||es, rr=pd(s.result);
    const c=byId(s.certId);
    if(rs && t===rs.getTime()) out.push({k:"reg",s,c,label:"접수 시작"});
    if(re && t===re.getTime()) out.push({k:"due",s,c,label:"접수 마감"+(s.regTime?" "+s.regTime:"")});
    if(es && t>=es.getTime() && t<=ee.getTime()) out.push({k:"exam",s,c,label:(s.stage&&s.stage!=="단일"?s.stage+" ":"")+"시험"});
    if(rr && t===rr.getTime()) out.push({k:"result",s,c,label:s.resultLabel||"합격 발표"});
  }
  return out;
}
function inReg(date){
  const t=date.getTime();
  return visibleScheds().some(s=>{const a=pd(s.regStart),b=pd(s.regEnd);return a&&b&&t>=a.getTime()&&t<=b.getTime();});
}

function schedLine(s){
  const stage = s.stage && s.stage!=="단일" ? " · "+s.stage : "";
  return esc(s.round||"")+stage;
}
function homeHTML(){
  const y=S.month.getFullYear(), m=S.month.getMonth();
  const ms=new Date(y,m,1), me=new Date(y,m+1,0);
  const vs=visibleScheds();
  const regs=vs.filter(s=>pd(s.regStart)<=me && pd(s.regEnd)>=ms).sort((a,b)=>pd(a.regEnd)-pd(b.regEnd));
  const exams=vs.filter(s=>{const a=pd(s.examStart); if(!a) return false; const b=pd(s.examEnd)||a; return a<=me&&b>=ms;}).sort((a,b)=>pd(a.examStart)-pd(b.examStart));
  const none = D.schedules.length===0 && OFFICIAL.length===0;

  const regLi = regs.map(s=>{
    const c=byId(s.certId), rs=pd(s.regStart), re=pd(s.regEnd);
    let dd, hot=false;
    if(diff(rs)>0){ dd="시작 "+ddayText(diff(rs)); }
    else if(diff(re)>=0){ dd="마감 "+ddayText(diff(re)); hot=diff(re)<=3; }
    else dd="접수 마감됨";
    return `<li><button class="ev-name" data-open="${c.id}">${esc(c.name)}</button>
      <div class="ev-side"><span class="dday${hot?" hot":""}">${dd}</span>
      <a class="btn sm" href="${ORGS[c.org].url}" target="_blank" rel="noopener noreferrer">접수 사이트</a></div>
      <div class="ev-meta">${schedLine(s)}${s.official?' <span class="src-tag">공식 일정</span>':""}<br>접수 ${fmt(rs)} ~ ${fmt(re)}${s.regTime?" "+esc(s.regTime):""}${s.official&&!s.examStart?"<br>시험일은 지역·시험장별로 공식 사이트에서 확인":""}</div></li>`;
  }).join("");
  const examLi = exams.map(s=>{
    const c=byId(s.certId), es=pd(s.examStart), ee=pd(s.examEnd);
    const n=diff(es);
    return `<li><button class="ev-name" data-open="${c.id}">${esc(c.name)}</button>
      <div class="ev-side"><span class="dday${n>=0&&n<=7?" hot":""}">${n<0&&ee&&diff(ee)>=0?"시험 기간":(n<0?"시험 종료":ddayText(n))}</span></div>
      <div class="ev-meta">${schedLine(s)}${s.official?' <span class="src-tag">공식 일정</span>':""}<br>시험 ${fmt(es)}${ee&&ee.getTime()!==es.getTime()?" ~ "+fmt(ee):""}</div></li>`;
  }).join("");

    ? `아직 입력한 시험 일정이 없어요. 공식 일정을 보고 <button class="linkbtn" data-act="add">일정 추가</button>를 눌러 넣어 주세요.`

    </div>
  </div>
  <div class="row-actions" style="margin-bottom:16px">
    <div class="seg" role="group" aria-label="보기 범위">
      <button aria-pressed="${!S.favOnly}" data-act="all">전체 일정</button>

    </div>
    <button class="btn primary sm" data-act="add">+ 일정 추가</button>
    <a class="btn sm" href="https://www.q-net.or.kr" target="_blank" rel="noopener noreferrer">큐넷 공식 일정 보기</a>
  </div>

  ${none?`<div class="notice"><strong>일정은 공식 공고를 보고 직접 넣어요</strong>시험 일정은 해마다 새로 발표되고 회차마다 달라서, 이 도구는 날짜를 추측해 채우지 않아요. 큐넷이나 각 주관기관 사이트의 공식 일정을 확인해 관심 있는 자격증만 추가해 보세요.</div>`:""}

      ${exams.length?`<ul class="ev-list">${examLi}</ul>`:`<p class="empty">${none?"일정을 추가하면 여기에 시험일과 D-day가 표시돼요.":emptyMsg}</p>`}</section>
  </div>

}

function calendarHTML(y,m){
  const first=new Date(y,m,1), start=new Date(y,m,1-first.getDay());
  const last=new Date(y,m+1,0);
  const weeks=Math.ceil((first.getDay()+last.getDate())/7);
  let cells="";
  for(let i=0;i<weeks*7;i++){
    const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);
    const evs=eventsOn(d), out=d.getMonth()!==m;
    const isT=d.getTime()===TODAY.getTime(), sel=S.selDay===ymd(d);
    const shown=evs.slice(0,3);
    const pills=shown.map(e=>`<span class="pill"><i class="dot d-${e.k}"></i><span class="txt">${esc(e.c.name.split(" (")[0])}</span></span>`).join("");
    const label=`${d.getMonth()+1}월 ${d.getDate()}일${evs.length?", 일정 "+evs.length+"개":""}`;
    cells+=`<button class="day${out?" out":""}${isT?" today":""}${sel?" sel":""}" data-day="${ymd(d)}" aria-label="${label}">
      ${inReg(d)?'<span class="hlbar" aria-hidden="true"></span>':""}
      <span class="num">${d.getDate()}</span>
      <span class="evs">${pills}${evs.length>3?`<span class="more">+${evs.length-3}개</span>`:""}</span></button>`;
  }
  let panel="";
  if(S.selDay){
    const d=pd(S.selDay), evs=eventsOn(d);
    panel=`<div class="daypanel"><h4>${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})</h4>
      ${evs.length?`<ul class="ev-list">${evs.map(e=>`<li><button class="ev-name" data-open="${e.c.id}">${esc(e.c.name)}</button>
        <div class="ev-side"><span class="dday"><i class="dot d-${e.k}"></i> ${esc(e.label)}</span></div>
        <div class="ev-meta">${schedLine(e.s)}${e.s.official?' <span class="src-tag">공식 일정</span>':""}</div></li>`).join("")}</ul>`:`<p class="empty">이날은 일정이 없어요.</p>`}</div>`;
  }
  return `<section class="cal-wrap" aria-label="월간 캘린더">
    <div class="legend"><span><i class="lg-hl"></i>접수 기간</span><span><i class="dot d-reg"></i>접수 시작</span><span><i class="dot d-due"></i>접수 마감</span><span><i class="dot d-exam"></i>시험일</span><span><i class="dot d-result"></i>합격 발표</span></div>
    <div class="cal">${WD.split("").map((w,i)=>`<div class="wd${i===0?" sun":""}">${w}</div>`).join("")}${cells}</div>
    ${panel}</section>`;
}

function mineHTML(){
  if(!D.schedules.length) return "";
  const rows=[...D.schedules].sort((a,b)=>pd(a.regStart)-pd(b.regStart)).map(s=>{
    const c=byId(s.certId);
    return `<div class="sched-row"><div><strong>${esc(c.name)}</strong> <span class="muted">${schedLine(s)}</span><br>
      <span class="small muted">접수 ${fmt(pd(s.regStart))} ~ ${fmt(pd(s.regEnd))}${s.examStart?" · 시험 "+fmt(pd(s.examStart)):""}${s.result?" · 발표 "+fmt(pd(s.result)):""}${s.note?"<br>출처: "+esc(s.note):""}</span></div>
      <button class="btn sm" data-del="${esc(s.id)}">삭제</button></div>`;
  }).join("");
  return `<details class="mine"><summary>내가 입력한 일정 ${D.schedules.length}개 관리</summary>${rows}</details>`;

function filteredCerts(){
  let list=CERTS;
  let cat=null;
  if(S.cat){ cat=CATS[S.tab].find(x=>x.id===S.cat); if(cat) list=cat.certs.map(byId); }
  const q=S.q.trim().toLowerCase();
  if(q){
    list=(cat?list:CERTS).filter(c=>[c.name,c.kind,ORGS[c.org].name,...c.tags,...c.fields].join(" ").toLowerCase().includes(q));
  }
  const f=S.f;
  if(f.lv) list=list.filter(c=>String(c.lv)===f.lv);
  if(f.kind) list=list.filter(c=>c.kind===f.kind);
  if(f.free) list=list.filter(c=>c.elig==="none");
  if(f.sb) list=list.filter(c=>c.sb===f.sb);
  return {list,cat};
}
function suggest(q){
  q=q.trim(); if(!q) return [];
  const grams=new Set(); for(let i=0;i<q.length-1;i++) grams.add(q.slice(i,i+2).toLowerCase());
  return CERTS.map(c=>{const t=(c.name+" "+c.tags.join(" ")).toLowerCase();let s=0;grams.forEach(g=>{if(t.includes(g))s++;});return {c,s};})
    .filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,4).map(x=>x.c);
}

const BCATS=[["q","질문"],["tip","꿀팁"],["pass","합격 후기"],["free","자유"]];

function ago(ms){
  const d=Date.now()-ms; if(d<60000) return "방금"; if(d<3600000) return Math.floor(d/60000)+"분 전";
  if(d<86400000) return Math.floor(d/3600000)+"시간 전"; const t=new Date(ms); return (t.getFullYear()!==TODAY.getFullYear()?t.getFullYear()+".":"")+(t.getMonth()+1)+"."+t.getDate();
}
function catTag(c){ return `<span class="cat cat-${esc(c)}">${esc(BCAT_NAME[c]||"자유")}</span>`; }

  return "";
}

async function savePost(fd){
  const mineDoc=B.postDocs[ME.uid]||{items:[]};
  let items=[...(mineDoc.items||[])];
  const now=Date.now();
  if(S.ov.edit){ items=items.map(p=>p.id===S.ov.edit?{...p,cat:fd.cat,certId:fd.certId,title:fd.title,body:fd.body,edited:now}:p); }
  else items.push({id:now.toString(36)+Math.random().toString(36).slice(2,6),cat:fd.cat,certId:fd.certId,title:fd.title,body:fd.body,at:now});
  if(items.length>150) items=items.slice(-150);
  const pid=S.ov.edit||items[items.length-1].id;
  await writeDoc("posts/"+ME.uid,{items});
  return pid;
}
async function delPost(author,id){
  const d=B.postDocs[author]; if(!d) return;
  await writeDoc("posts/"+author,{items:(d.items||[]).filter(p=>p.id!==id)});
}

function notifications(){
  const out=[];
  if(D.notif.sched){
    for(const s of [...OFFICIAL,...D.schedules]){
      if(!isFav(s.certId)) continue;
      const c=byId(s.certId), rs=pd(s.regStart), re=pd(s.regEnd), es=pd(s.examStart), rr=pd(s.result);
      const tag=c.name+" · "+(s.round||"")+(s.stage&&s.stage!=="단일"?" "+s.stage:"");
      if(rs&&diff(rs)>=0&&diff(rs)<=7) out.push({k:"sched",cert:c.id,unread:true,w:diff(rs),t:`접수 시작 ${ddayText(diff(rs))}`,d:tag});
      else if(rs&&re&&diff(rs)<0&&diff(re)>=0&&diff(re)<=3) out.push({k:"sched",cert:c.id,unread:true,w:diff(re),t:`접수 마감 ${ddayText(diff(re))}${s.regTime?" ("+s.regTime+")":""}`,d:tag});
      if(es&&diff(es)>=0&&diff(es)<=7) out.push({k:"sched",cert:c.id,unread:true,w:diff(es),t:`시험 ${ddayText(diff(es))}`,d:tag});
      if(rr&&diff(rr)>=0&&diff(rr)<=3) out.push({k:"sched",cert:c.id,unread:true,w:diff(rr),t:`${s.resultLabel||"합격 발표"} ${ddayText(diff(rr))}`,d:tag});
    }
    out.sort((a,b)=>a.w-b.w);
  }
  if(D.notif.comment&&ME.uid){
    const myPosts=new Map(postsAll().filter(p=>p.author===ME.uid).map(p=>[p.id,p]));
    cmtsAll().filter(c=>myPosts.has(c.postId)&&c.author!==ME.uid).sort((a,b)=>b.at-a.at).slice(0,20).forEach(c=>{
      out.push({k:"cmt",post:ME.uid+"|"+c.postId,unread:c.at>D.lastSeen,t:`${nm(c.author)}님이 댓글을 남겼어요`,d:myPosts.get(c.postId).title,at:c.at});
    });
  }
  return out;
}

function addHTML(){
  const sorted=[...CERTS].sort((a,b)=>a.name.localeCompare(b.name,"ko"));
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="at">
    <div class="sheet-head"><button class="btn sm ghost" data-act="close">‹ 닫기</button><h2 id="at">시험 일정 추가</h2></div>
    <div class="sheet-body">
      <p class="notice" style="margin-bottom:16px">공식 공고에 나온 날짜를 그대로 입력하세요. 출처를 적어 두면 나중에 다시 확인하기 쉬워요.</p>
      <form class="f" id="addForm" novalidate>
        <label>자격증<select name="certId" required><option value="">선택하세요</option>${sorted.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></label>
        <div class="two">
          <label>연도·회차<input name="round" required placeholder="예: 2027년 정기 기사 1회"></label>
          <label>시험 구분<select name="stage"><option>필기</option><option>실기</option><option>단일</option></select></label>
        </div>
        <div class="two">
          <label>접수 시작일<input type="date" name="regStart" required></label>
          <label>접수 마감일<input type="date" name="regEnd" required></label>
        </div>
        <label>접수 마감 시각 <span class="hint">공고에 있으면 입력 (예: 18:00)</span><input name="regTime" placeholder="18:00"></label>
        <div class="two">
          <label>시험일 (시작) <span class="hint">미발표면 비워 두세요</span><input type="date" name="examStart"></label>
          <label>시험일 (끝) <span class="hint">CBT처럼 기간이면 입력</span><input type="date" name="examEnd"></label>
        </div>
        <label>합격 발표일 <span class="hint">선택</span><input type="date" name="result"></label>
        <label>출처 메모 <span class="hint">선택 (예: 큐넷 2027 시험일정 공고)</span><input name="note"></label>
        <p class="err" id="addErr" role="alert"></p>
        <div class="row-actions"><button class="btn primary" type="submit">일정 저장</button><button class="btn" type="button" data-act="close">취소</button></div>
      </form></div></div>`;
}
let lastFocus=null;
function renderOverlay(){
  const el=document.getElementById("overlay");
  if(!S.ov){ if(el.innerHTML){el.innerHTML=""; el.dataset.key=""; document.body.style.overflow=""; if(lastFocus&&lastFocus.isConnected) lastFocus.focus();} return; }
  const key=JSON.stringify(S.ov);
  const same = el.dataset.key===key && el.innerHTML;
  if(same && (S.ov.t==="add"||S.ov.t==="write")) return;
  let keep=null, scr=0;
  if(same){ const sh=el.querySelector(".sheet"); scr=sh?sh.scrollTop:0; const ta=document.getElementById("cmtBody"); if(ta) keep={v:ta.value,f:document.activeElement===ta}; }
  let html="";
  if(S.ov.t==="detail") html=detailHTML(byId(S.ov.id));
  else if(S.ov.t==="cmp") html=compareHTML();
  else if(S.ov.t==="add") html=addHTML();
  else if(S.ov.t==="post") html=postHTML(S.ov.a,S.ov.id);
  else if(S.ov.t==="write") html=writeHTML();
  else if(S.ov.t==="notif") html=notifHTML(notifications());
  const wasOpen=!!el.innerHTML;
  el.innerHTML=`<div class="ov" data-act="backdrop">${html}</div>`;
  el.dataset.key=key;
  document.body.style.overflow="hidden";
  const sheet=el.querySelector(".sheet"); if(sheet && !wasOpen) { const b=sheet.querySelector("[data-act=close]"); b&&b.focus(); }
  if(sheet) sheet.scrollTop=same?scr:0;
  if(keep){ const ta=document.getElementById("cmtBody"); if(ta){ ta.value=keep.v; if(keep.f) ta.focus(); } }
}

/* =========================
   이벤트
   ========================= */
function openDetail(id){ if(!S.ov) lastFocus=document.activeElement; S.ov={t:"detail",id}; renderOverlay(); }
function toggleFav(id){
  const i=D.favs.indexOf(id); if(i>=0) D.favs.splice(i,1); else D.favs.push(id);
  persist(); render();
}
document.addEventListener("click",ev=>{
  const t=ev.target;
  const nav=t.closest("nav.tabs button"); if(nav){S.view=nav.dataset.view; S.ov=null; render(); window.scrollTo(0,0); return;}
  const op=t.closest("[data-open]"); if(op){ openDetail(op.dataset.open); return; }
  const po=t.closest("[data-post]"); if(po){ const [a,id]=po.dataset.post.split("|"); if(!S.ov) lastFocus=document.activeElement; S.ov={t:"post",a,id}; renderOverlay(); return; }
  const bc=t.closest("[data-bcat]"); if(bc){ S.bcat=bc.dataset.bcat; render(); return; }
  const bce=t.closest("[data-boardcert]"); if(bce){ S.view="board"; S.bcert=bce.dataset.boardcert; S.bcat=""; S.bq=""; S.ov=null; render(); window.scrollTo(0,0); return; }
  const dc=t.closest("[data-delcmt]"); if(dc){ const [a,id]=dc.dataset.delcmt.split("|"); if(confirm("이 댓글을 삭제할까요?")) delCmt(a,id).then(()=>toast("댓글을 삭제했어요.")).catch(writeFail); return; }
  const fv=t.closest("[data-fav]"); if(fv){ toggleFav(fv.dataset.fav); return; }
  const go=t.closest("[data-go]"); if(go){ S.view=go.dataset.go; S.ov=null; render(); window.scrollTo(0,0); return; }
  const gc=t.closest("[data-gocat]"); if(gc){ const id=gc.dataset.gocat; S.tab=CATS.major.some(x=>x.id===id)?"major":"interest"; S.cat=id; S.q=""; S.f={lv:"",kind:"",free:false,sb:""}; render(); return; }
  const tb=t.closest("[data-tab]"); if(tb){ S.tab=tb.dataset.tab; S.cat=null; render(); return; }
  const ct=t.closest("[data-cat]"); if(ct){ S.cat=ct.dataset.cat||null; render(); return; }
  const dy=t.closest("[data-day]"); if(dy){ S.selDay = S.selDay===dy.dataset.day?null:dy.dataset.day; render(); return; }
  const del=t.closest("[data-del]"); if(del){ D.schedules=D.schedules.filter(s=>s.id!==del.dataset.del); persist(); render(); return; }
  const a=t.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="backdrop"){ if(t===a){S.ov=null;renderOverlay();} return; }
  if(act==="close"){S.ov=null;renderOverlay();return;}
  if(act==="prev"){S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);S.selDay=null;render();}
  if(act==="next"){S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);S.selDay=null;render();}
  if(act==="today"){S.month=new Date(TODAY.getFullYear(),TODAY.getMonth(),1);S.selDay=ymd(TODAY);render();}
  if(act==="all"){S.favOnly=false;render();}
  if(act==="favonly"){S.favOnly=true;render();}
  if(act==="add"){lastFocus=document.activeElement;S.ov={t:"add"};renderOverlay();}
  if(act==="cmpclear"){S.cmp=[];render();}
  if(act==="cmpopen"){lastFocus=document.activeElement;S.ov={t:"cmp"};renderOverlay();}
  if(act==="notif"){ lastFocus=document.activeElement; S.ov={t:"notif"}; renderOverlay(); D.lastSeen=Date.now(); persist(); renderHeader(); return; }
  if(act==="write"){ lastFocus=document.activeElement; S.ov={t:"write",cert:S.bcert||""}; renderOverlay(); return; }
  if(act==="editpost"){ S.ov={t:"write",edit:S.ov.id}; renderOverlay(); return; }
  if(act==="delpost"){ const {a,id}=S.ov; if(confirm("이 글을 삭제할까요? 삭제하면 되돌릴 수 없어요.")){ delPost(a,id).then(()=>{S.ov=null;render();toast("글을 삭제했어요.");}).catch(writeFail);} return; }
  if(act==="like"){ toggleLike(S.ov.id).catch(writeFail); return; }
  if(act==="reset"){S.q="";S.cat=null;S.f={lv:"",kind:"",free:false,sb:""};render();}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset.cmp){
    const id=t.dataset.cmp;
    if(t.checked){ if(S.cmp.length>=3){ t.checked=false; alertCmp(); return; } S.cmp.push(id); }
    else S.cmp=S.cmp.filter(x=>x!==id);
    renderCmpBar(); return;
  }
  if(t.dataset.f){ const k=t.dataset.f; S.f[k]= k==="free"?t.checked:t.value; render(); return; }
  if(t.dataset.b){ S[t.dataset.b]=t.value; render(); return; }
  if(t.dataset.n){ D.notif[t.dataset.n]=t.checked; persist(); renderOverlay(); renderHeader(); return; }
  if(t.dataset.p){ const k=t.dataset.p; D.profile[k]= k==="exp"?Number(t.value):t.value; persist(); return; }
});
function alertCmp(){
  const bar=document.querySelector(".cmpbar .names");
  if(bar){ bar.innerHTML=`<strong>비교는 최대 3개까지 할 수 있어요.</strong> <span class="muted">선택을 하나 해제한 뒤 다시 골라 주세요.</span>`; setTimeout(renderCmpBar,2500); }
}
let qTimer=null;
document.addEventListener("input",ev=>{
  if(ev.target.id==="bq"){ S.bq=ev.target.value; clearTimeout(qTimer); qTimer=setTimeout(render,200); return; }
  if(ev.target.id==="q"){
    S.q=ev.target.value; clearTimeout(qTimer);
    qTimer=setTimeout(()=>{
      const pos=ev.target.selectionStart; render();
      const q=document.getElementById("q"); if(q){q.focus(); try{q.setSelectionRange(pos,pos);}catch(e){}}
    },200);
  }
});
document.addEventListener("submit",ev=>{
  if(ev.target.id==="postForm"){
    ev.preventDefault();
    const fd=Object.fromEntries(new FormData(ev.target).entries()); for(const k in fd) fd[k]=String(fd[k]).trim();
    const err=document.getElementById("postErr");
    if(!fd.title){err.textContent="제목을 입력하세요.";return;}
    if(fd.body.length<5){err.textContent="내용을 5자 이상 입력하세요.";return;}
    fd.title=fd.title.slice(0,80); fd.body=fd.body.slice(0,3000); if(!byId(fd.certId)) fd.certId=""; if(!BCAT_NAME[fd.cat]) fd.cat="free";
    const btn=ev.target.querySelector("[type=submit]"); btn.disabled=true;
    savePost(fd).then(pid=>{ S.ov={t:"post",a:ME.uid,id:pid}; S.view="board"; render(); toast("글을 등록했어요."); }).catch(e=>{btn.disabled=false; writeFail(e);});
    return;
  }
  if(ev.target.id==="cmtForm"){
    ev.preventDefault();
    const ta=document.getElementById("cmtBody"); const v=ta.value.trim().slice(0,1000);
    if(!v){ ta.focus(); return; }
    const pid=S.ov.id; ta.value="";
    addCmt(pid,v).then(()=>toast("댓글을 등록했어요.")).catch(e=>{ ta.value=v; writeFail(e); });
    return;
  }
  if(ev.target.id!=="addForm") return;
  ev.preventDefault();
  const fd=Object.fromEntries(new FormData(ev.target).entries());
  const err=document.getElementById("addErr");
  for(const k of Object.keys(fd)) fd[k]=String(fd[k]).trim();
  if(!fd.certId){err.textContent="자격증을 선택하세요.";return;}
  if(!fd.round){err.textContent="연도·회차를 입력하세요. (예: 2027년 정기 기사 1회)";return;}
  if(!fd.regStart||!fd.regEnd){err.textContent="접수 시작일과 마감일을 모두 입력하세요.";return;}
  if(pd(fd.regStart)>pd(fd.regEnd)){err.textContent="접수 마감일이 시작일보다 빠를 수 없어요.";return;}
  if(fd.examEnd && !fd.examStart){err.textContent="시험일 끝을 넣으려면 시작일도 입력하세요.";return;}
  if(fd.examStart && fd.examEnd && pd(fd.examEnd)<pd(fd.examStart)){err.textContent="시험일 끝이 시작보다 빠를 수 없어요.";return;}
  if(fd.examStart && pd(fd.examStart)<pd(fd.regStart)){err.textContent="시험일이 접수 시작일보다 빠를 수 없어요. 날짜를 다시 확인하세요.";return;}
  const s={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),certId:fd.certId,round:fd.round.slice(0,60),stage:fd.stage||"단일",
    regStart:fd.regStart,regEnd:fd.regEnd,regTime:fd.regTime.slice(0,20),examStart:fd.examStart||"",examEnd:fd.examEnd||"",result:fd.result||"",note:fd.note.slice(0,100)};
  D.schedules.push(s); persist();
  const rs=pd(s.regStart); S.month=new Date(rs.getFullYear(),rs.getMonth(),1); S.selDay=null; S.view="home";
  S.ov=null; render();
});
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&S.ov){S.ov=null;renderOverlay();} });

render();
</script>
